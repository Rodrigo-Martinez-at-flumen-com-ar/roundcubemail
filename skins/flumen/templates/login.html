<roundcube:include file="includes/layout.html" />

<h1 class="voice">Flumen Webmail</h1>

<div id="layout-content" class="selected no-navbar" role="main">
	<roundcube:object name="logo" src="/images/logo.svg" id="logo" alt="Flumen" />
	<roundcube:form id="login-form" name="login-form" method="post" class="propform">
	<roundcube:object name="loginform" form="login-form" size="40" submit=true class="form-control" />
		<div id="login-footer" role="contentinfo">
			<span>Flumen Webmail</span>
			<roundcube:container name="loginfooter" id="login-footer" />
		</div>
	</form>
</div>

<script>
(function () {
  function hideHost() {
    var host = document.getElementById('rcmloginhost');
    if (!host) return;
    if (host.type === 'hidden') return;
    var row = host.closest('tr') || host.closest('.row') || host.closest('.form-group') || host.parentNode;
    if (row && row !== document.body) row.style.display = 'none';
    host.style.display = 'none';
    var lab = document.querySelector('label[for="rcmloginhost"]');
    if (lab) lab.style.display = 'none';
  }
  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', hideHost);
  } else {
    hideHost();
  }
})();
</script>

<noscript>
	<p class="noscriptwarning"><roundcube:label name="noscriptwarning" /></p>
</noscript>

<roundcube:include file="includes/footer.html" />
